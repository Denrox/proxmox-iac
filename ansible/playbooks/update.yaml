---
- name: Update and upgrade packages
  hosts: "{{ update_hosts | default('all') }}"
  become: true
  tasks:
    - name: Update the package list
      ansible.builtin.apt:
        update_cache: true

    - name: Upgrade everything
      ansible.builtin.apt:
        upgrade: dist

    - name: Remove what nothing needs any more
      ansible.builtin.apt:
        autoremove: true
        purge: true
